name: CI

# This repository had no checks of its own. Every workflow it publishes is
# `on: workflow_call`, and a reusable workflow never triggers on its own
# pull requests — so nothing validated this repo before a merge.
#
# That matters more here than in an ordinary repo. Consumers reference @master,
# so anything merged is live in three repos immediately, and a mistake surfaces
# as *their* CI breaking, with no pull request of their own to explain why.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Covers the workflow files: expression syntax, unknown keys, bad
      # `runs-on`, shellcheck over `run:` blocks. It does NOT check the
      # `action.yml` of a composite action — that gap is why the job below
      # exists as well.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  input-refs:
    name: Check input references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'

      - name: Install js-yaml
        run: npm install --no-save --no-package-lock js-yaml

      - name: Check every inputs.* reference is declared
        run: node scripts/check-input-refs.js

  # The review assets are published files that nothing in this repo executes:
  # claude-review.yml checks them out into the *caller's* workspace and
  # runs them there. So a syntax error, or a rename that leaves the workflow
  # pointing at a path that no longer exists, would first be seen by a consumer
  # — as a review job that dies partway, which is exactly the failure the gate
  # is supposed to be immune to.
  review-assets:
    name: Check review assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'

      - name: Parse the review scripts
        run: |
          for f in review/*.mjs; do
            node --check "$f"
            echo "ok   $f"
          done

      # The workflow compacts the schema with jq and passes the result to
      # --json-schema. Invalid JSON there fails the review step with a quoting
      # error rather than anything that names the schema.
      - name: Compact the schema the way the workflow does
        run: jq -c . review/schema.json > /dev/null

      - name: Check every tooling path the workflow references exists
        run: |
          missing=0
          while read -r ref; do
            file="${ref#.claude-review/tooling/}"
            if [ ! -f "$file" ]; then
              echo "::error::claude-review.yml references $ref, but $file is not in this repo"
              missing=1
            else
              echo "ok   $file"
            fi
          done < <(grep -oE '\.claude-review/tooling/[A-Za-z0-9_./-]+' \
                     .github/workflows/claude-review.yml | sort -u)
          exit "$missing"

      # The step above checks the paths that exist in this repo. The rest of
      # `.claude-review/` is written during the run — the two collected files
      # and the copy of the caller's prompt-file — so existence is not
      # checkable here, but agreement is: every `{{file:.claude-review/...}}`
      # the prompt reads has to be a path some step in the same file writes.
      #
      # A reference and the step writing it are two unrelated string literals,
      # and their disagreement is silent at run time: `{{file:...}}` is expanded
      # by the reviewer alone, a path resolving to nothing produces no error,
      # and an empty section of the prompt reads exactly like a file with
      # nothing in it. The prompt-file reference was wrong for the whole life of
      # this workflow and no run ever said so.
      - name: Check the generated prompt paths agree with the steps writing them
        run: |
          wf=.github/workflows/claude-review.yml
          written=$(
            {
              grep -oE 'OUT_FILE: \.claude-review/[A-Za-z0-9_./-]+' "$wf" |
                sed 's/^OUT_FILE: //'
              grep -oE 'cp .+ \.claude-review/[A-Za-z0-9_./-]+' "$wf" |
                grep -oE '\.claude-review/[A-Za-z0-9_./-]+$'
            } | sort -u
          )
          missing=0
          while read -r ref; do
            # Skip the tooling checkout: those are files in this repo, and the
            # step above already checks them the stronger way.
            case "$ref" in
              .claude-review/tooling/*) continue ;;
            esac
            if printf '%s\n' "$written" | grep -qxF "$ref"; then
              echo "ok   $ref"
            else
              echo "::error::the prompt reads {{file:$ref}}, but no step in claude-review.yml writes that path."
              echo "Either the reference or the step that produces it was renamed without the other."
              missing=1
            fi
          done < <(grep -oE '\{\{file:\.claude-review/[A-Za-z0-9_./-]+\}\}' "$wf" |
                     sed -E 's/^\{\{file:(.*)\}\}$/\1/' | sort -u)
          exit "$missing"

  # Smoke test: this repo calls its own reusable workflow, so a change to
  # check-member.yml is executed before it can be merged rather than after.
  #
  # Deliberately runs on push as well as pull_request. On a push there is no
  # pull_request payload, which exercises the guard that reports 'false' instead
  # of throwing — the path that used to fail the job outright.
  self-test:
    name: Self-test
    permissions:
      contents: read
    uses: ./.github/workflows/check-member.yml
