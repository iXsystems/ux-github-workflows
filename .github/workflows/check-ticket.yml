name: Check Ticket (shared)

# Requires every pull request to reference a Jira ticket in its title.
#
# NOTE: if this is made a required status check, remember that PRs opened with
# the default GITHUB_TOKEN never fire pull_request events, so this workflow
# never runs and never reports — such a PR is unmergeable with no way to unblock
# it from the PR side. PRs opened by automation must use a PAT/app token.
#
# Usage:
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#
#   jobs:
#     check-ticket:
#       uses: iXsystems/ux-github-workflows/.github/workflows/check-ticket.yml@v1
#       with:
#         ticket-prefixes: TNC        # optional; defaults to NAS

on:
  workflow_call:
    inputs:
      ticket-prefixes:
        description: >-
          Comma-separated Jira project keys accepted in the PR title, e.g.
          "NAS", "TNC", or "NAS,TNC" to accept either.
        type: string
        default: 'NAS'

permissions:
  contents: read

concurrency:
  group: check-ticket-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-ticket:
    name: Check PR references a ticket
    runs-on: ubuntu-latest
    steps:
      - name: Check ticket reference in PR title
        uses: actions/github-script@v7
        env:
          # Passed through env rather than interpolated into the script body:
          # `${{ }}` inside `script:` splices caller-controlled text straight
          # into the JS source, which is a script-injection vector.
          TICKET_PREFIXES: ${{ inputs.ticket-prefixes }}
        with:
          script: |
            const raw = process.env.TICKET_PREFIXES || '';
            const prefixes = raw.split(',').map((p) => p.trim()).filter(Boolean);

            // Validate before building a regex out of them — a stray character
            // would otherwise produce a pattern that silently matches nothing
            // and turns this check into a permanent no-op.
            const invalid = prefixes.filter((p) => !/^[A-Za-z][A-Za-z0-9]*$/.test(p));
            if (prefixes.length === 0 || invalid.length > 0) {
              core.setFailed(
                `Invalid \`ticket-prefixes\` input: "${raw}".\n` +
                `Expected comma-separated Jira project keys, for example "NAS" or "NAS,TNC".`
              );
              return;
            }

            // Case-sensitive on purpose: bugclerk only links the Jira ticket for
            // an uppercase key. The case-insensitive twin exists solely to give
            // a better error when someone writes "nas-12345".
            const alternation = prefixes.map((p) => p.toUpperCase()).join('|');
            const TICKET_PATTERN = new RegExp(`\\b(?:${alternation})-\\d+\\b`);
            const WRONG_CASE_PATTERN = new RegExp(TICKET_PATTERN.source, 'i');

            // Every pull request needs a ticket — no bot or label exemptions.
            const title = context.payload.pull_request.title || '';

            if (TICKET_PATTERN.test(title)) {
              core.info(`Found ticket ${title.match(TICKET_PATTERN)[0]} in PR title.`);
              return;
            }

            const wrongCase = title.match(WRONG_CASE_PATTERN);
            const example = prefixes[0].toUpperCase();
            const accepted = prefixes.map((p) => `${p.toUpperCase()}-`).join(', ');

            core.setFailed(
              (wrongCase
                ? `This pull request references "${wrongCase[0]}", but the ticket must be uppercase (${accepted}).\n\n`
                : `This pull request does not reference a ticket.\n\n`) +
              `Current title: "${title}"\n\n` +
              `Add the ticket number to the pull request title, for example:\n` +
              `  ${example}-12345: Fix broken thing\n` +
              `  ${example}-12345 / 27.0.0-BETA.1 / Fix broken thing`
            );
